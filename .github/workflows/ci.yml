name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Do NOT put `RUSTFLAGS: -D warnings` here — it cascades to transitive
  # deps (rusty-kaspa etc.) whose warnings we can't fix. Each step that
  # wants warnings-as-errors uses the flag locally.

jobs:
  check:
    name: Check + fmt + clippy + unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib

  integration:
    name: Integration tests (gated on KUN_TEST_NODE_URL)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Full test suite
        env:
          KUN_TEST_NODE_URL: ${{ secrets.KUN_TEST_NODE_URL }}
        run: cargo test --workspace
