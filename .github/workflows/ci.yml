name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow only builds and tests; it never writes back to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Do NOT put `RUSTFLAGS: -D warnings` here — it cascades to transitive
  # deps (rusty-kaspa etc.) whose warnings we can't fix. Each step that
  # wants warnings-as-errors uses the flag locally.

jobs:
  check:
    name: Check + fmt + clippy + tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Third-party actions are pinned to a commit SHA rather than a moving
      # tag: a tag can be repointed at new code without the ref here changing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
