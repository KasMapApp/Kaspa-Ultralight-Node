[workspace]
resolver = "2"
members = [
    "crates/kun-core",
    "crates/kun-proofs",
    "crates/kun-proof-source",
    "crates/kun-storage",
    "crates/kun-rpc",
    "crates/kun-sync",
    "crates/kun-verifier",
    "crates/kun-client",
    "crates/kun-cli",
    "crates/kun-wasm",
]

[workspace.package]
version      = "0.1.0-dev"
edition      = "2021"
rust-version = "1.85.0"
license      = "ISC"
repository   = "https://github.com/KasMapApp/Kaspa-Ultralight-Node"
authors      = ["KUN contributors"]

[workspace.dependencies]
# --- Internal crates ---
kun-core         = { path = "crates/kun-core",         version = "0.1.0-dev" }
kun-proofs       = { path = "crates/kun-proofs",       version = "0.1.0-dev" }
kun-proof-source = { path = "crates/kun-proof-source", version = "0.1.0-dev" }
kun-storage      = { path = "crates/kun-storage",      version = "0.1.0-dev" }
kun-rpc          = { path = "crates/kun-rpc",          version = "0.1.0-dev" }
kun-sync         = { path = "crates/kun-sync",         version = "0.1.0-dev" }
kun-verifier     = { path = "crates/kun-verifier",     version = "0.1.0-dev" }
kun-client       = { path = "crates/kun-client",       version = "0.1.0-dev" }

# --- rusty-kaspa (pinned to v1.0.1; overridable via .cargo/config.toml [patch]) ---
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-hashes         = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-merkle         = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-pow            = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-rpc-core       = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-wrpc-client    = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }
kaspa-notify         = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v1.0.1" }

# --- Serialization ---
borsh         = { version = "1.5.1", features = ["derive", "rc"] }
serde         = { version = "1.0.190", features = ["derive"] }
serde_json    = "1.0"
hex           = { version = "0.4.3", features = ["serde"] }
bytes         = "1.7.1"

# --- Errors / logging ---
thiserror     = "1.0.50"
anyhow        = "1.0"
tracing       = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "ansi"] }

# --- Async / runtime ---
tokio         = { version = "1.33.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "io-util"] }
tokio-util    = "0.7"
futures       = "0.3.29"
async-trait   = "0.1.74"
async-stream  = "0.3.5"
backoff       = { version = "0.4.0", features = ["tokio"] }

# --- Hashing ---
blake2b_simd  = "1.0.2"
blake3        = "1.5"

# --- CLI ---
clap          = { version = "4.4.7", features = ["derive", "cargo", "string"] }

# --- Misc ---
parking_lot   = "0.12.1"
subtle        = "2.5"
bitvec        = "1.0"
lru           = "0.12"
directories   = "5.0"
zstd          = { version = "0.13", default-features = false }
csv           = "1.3"

# --- Testing ---
proptest      = "1.4"

# --- Storage (v0.2) ---
rocksdb       = "0.22.0"

# --- WASM (v0.2) ---
wasm-bindgen          = "0.2.100"
js-sys                = "0.3.70"
serde-wasm-bindgen    = "0.6.1"

[profile.release]
lto             = "thin"
strip           = true
overflow-checks = true

[profile.dev.package.rocksdb]
opt-level = 3   # debug builds of rocksdb are unusably slow

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
uninlined_format_args   = "allow"
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
must_use_candidate      = "allow"
missing_panics_doc      = "allow"
